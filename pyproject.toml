[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-trip-planner"
version = "0.1.0"
description = "A LangGraph workflow for conference discovery and trip planning"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.1,<10",
    "httpx>=0.28,<1",
    "langchain>=1.2.5,<2",
    "langchain-core>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "langchain-openrouter>=0.2.9,<1",
    "langgraph>=1.0.10,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.scripts]
conference-trip = "trip_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
